<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="description" content="TayAy • A guide for my new friends">
<title>TayAy</title>
<style>
:root {
  --bg:#080909;
  --panel:#111313;
  --text:#f3f1ed;
  --muted:#aaa59c;
  --gold:#c9a85b;
  --gold-soft:rgba(201,168,91,.42);
  --line:rgba(255,255,255,.09);
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:var(--bg); }
body {
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 50% 0%, rgba(201,168,91,.10), transparent 34%),
    linear-gradient(180deg,#0a0b0b 0%,#080909 70%);
}
.wrap {
  width:min(100%, 520px);
  margin:0 auto;
  padding:42px 22px 34px;
  text-align:center;
}
.avatar {
  width:132px;height:132px;border-radius:50%;object-fit:cover;
  display:block;margin:0 auto 21px;
  border:1px solid rgba(201,168,91,.58);
  box-shadow:0 0 0 6px rgba(201,168,91,.055), 0 16px 50px rgba(0,0,0,.55);
}
.name {
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:42px;line-height:1.05;letter-spacing:-.6px;font-weight:500;
}
.bio {
  margin:11px 0 30px;
  color:var(--muted);
  font-size:15px;letter-spacing:.4px;
}
.links { display:grid; gap:12px; }
.link {
  min-height:58px;
  display:grid;grid-template-columns:34px 1fr 24px;align-items:center;
  padding:0 17px;
  color:var(--text);text-decoration:none;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  border:1px solid var(--line);
  border-radius:14px;
  transition:transform .18s ease,border-color .18s ease,background .18s ease;
}
.link:hover {
  transform:translateY(-1px);
  border-color:var(--gold-soft);
  background:linear-gradient(180deg,rgba(201,168,91,.09),rgba(255,255,255,.025));
}
.icon { width:20px;height:20px;color:var(--gold);display:flex;align-items:center;justify-content:center; }
.icon svg { width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round; }
.label { text-align:left;font-size:15px;letter-spacing:.25px; }
.arrow { color:#827b70;font-size:18px; }
.footer {
  margin-top:30px;color:#625f58;font-size:10px;letter-spacing:2.4px;text-transform:uppercase;
}
@media (max-width:380px) {
  .wrap { padding-left:16px;padding-right:16px; }
  .name { font-size:38px; }
}
</style>
</head>
